services:
  backend:
    ports: []
    expose:
      - "8000"
    environment:
      MAX_CONCURRENT_TASKS: "1"
      MAX_UPLOAD_BYTES: "536870912"
      MAX_VIDEO_DURATION_SECONDS: "3600"

  frontend:
    ports: []
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      VIDEONOTE_DOMAIN: ${VIDEONOTE_DOMAIN:?Set VIDEONOTE_DOMAIN to a DNS name pointing at this server}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
